name: Mercy Bot

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      session_minutes:
        description: "Minutes per session before chaining the next (max 350)"
        required: false
        default: "345"
  schedule:
    - cron: "25 */6 * * *"

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # CI — Python tests, syntax, and container validation on push and PR
  # ──────────────────────────────────────────────────────────────────────────
  checks:
    name: Unit tests and Python validation
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    concurrency:
      group: mercy-ci-checks-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Syntax and lint check
        run: |
          python -m py_compile main.py
      - name: Run unit test suite
        run: pytest tests/ -q

  docker:
    name: Docker build validation
    if: ${{ github.event_name == 'push' || github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    concurrency:
      group: mercy-ci-docker-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - name: Build container image
        run: docker build -t mercy-bot:ci .

  # ──────────────────────────────────────────────────────────────────────────
  # Bot runtime — long-running session on schedule and manual dispatch only.
  # Pushes run CI exclusively; they never start or queue a bot session.
  # ──────────────────────────────────────────────────────────────────────────
  run-bot:
    name: Run Mercy Bot Session
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    concurrency:
      group: mercy-bot-runner
      # Continuation dispatches successor after this completes. Never cancel active session.
      cancel-in-progress: false

    env:
      PYTHONUNBUFFERED: "1"
      PYTHONIOENCODING: "utf-8"
      DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
      MONGO_URL: ${{ secrets.MONGO_URL }}
      MONGODB_URI: ${{ secrets.MONGODB_URI || secrets.MONGO_URL }}
      WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
      OWNER_IDS: ${{ secrets.OWNER_IDS }}
      AUTO_SYNC_COMMANDS: "true"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install system dependencies (audio/voice)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg libopus0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check required runtime secrets
        run: |
          set -euo pipefail
          missing=()
          for key in DISCORD_TOKEN MONGO_URL; do
            if [ -z "${!key:-}" ]; then missing+=("${key}"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::Missing GitHub Actions runtime secrets: %s. Add these under Settings > Secrets and variables > Actions.\n' "$(IFS=', '; echo "${missing[*]}")"
            exit 1
          fi
          echo "Required bot runtime secrets are configured."

      - name: Prepare Environment Configuration
        run: |
          python scripts/setup-env.py
          chmod 0600 .env

      - name: Run Mercy Bot Session
        env:
          SESSION_MINUTES: ${{ inputs.session_minutes || '345' }}
        run: |
          SESSION_MINUTES="${SESSION_MINUTES:-345}"
          case "${SESSION_MINUTES}" in
            ''|*[!0-9]*) echo "session_minutes must be an integer"; SESSION_MINUTES=345 ;;
          esac
          if [ "${SESSION_MINUTES}" -gt 350 ]; then
            echo "Capping session to 350m (job limit is 360m)"
            SESSION_MINUTES=350
          fi
          seconds=$(( SESSION_MINUTES * 60 ))
          echo "🛡️ Launching Mercy bot session for ${SESSION_MINUTES}m (${seconds}s)..."

          set +e
          timeout --signal=INT --kill-after=90s "${seconds}s" python -u main.py &
          bot_pid=$!
          set -e

          # Wait for the bot session to finish, then honour its exit status.
          set +e
          wait "${bot_pid}"
          rc=$?
          set -e

          if [ "${rc}" -eq 124 ]; then
            echo "::notice::Session window ended cleanly after ${SESSION_MINUTES}m; continuation will start the next session."
            exit 0
          fi
          if [ "${rc}" -eq 0 ]; then
            echo "::notice::Mercy bot process stopped cleanly; continuation will start the next session."
            exit 0
          fi

          echo "::error::Mercy bot exited with status ${rc}; continuation will start a recovery session."
          exit "${rc}"

      - name: Session Summary
        if: always()
        run: |
          {
            echo "### 🛡️ Mercy Bot Session"
            echo ""
            echo "- **Status:** Session ended; continuation schedules the successor"
            echo "- **Runner:** ${RUNNER_NAME} (GitHub Actions Ubuntu)"
            echo "- **Runtime database:** MongoDB"
          } >> "${GITHUB_STEP_SUMMARY}"

  # ──────────────────────────────────────────────────────────────────────────
  # Session continuation — dependent job dispatches successor session
  # ──────────────────────────────────────────────────────────────────────────
  continuation:
    name: Start the next Mercy session
    needs: run-bot
    if: ${{ !cancelled() && needs.run-bot.result != 'cancelled' && needs.run-bot.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: mercy-session-continuation
      cancel-in-progress: false
    permissions:
      contents: read
      actions: write
    steps:
      - name: Back off after an unsuccessful session
        if: ${{ needs.run-bot.result != 'success' }}
        run: |
          echo "::warning::Previous Mercy session concluded as ${{ needs.run-bot.result }}."
          echo "Waiting 3 minutes before starting a recovery session."
          sleep 180

      - name: Dispatch the next bot session
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "Previous run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          echo "Previous conclusion: ${{ needs.run-bot.result }}"
          gh workflow run mercy-bot.yml \
            --repo "${GH_REPO}" \
            --ref main \
            -f session_minutes=345
          echo "::notice::Successor session dispatch accepted by GitHub Actions."

      - name: Verify successor run was created
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            if gh run list --repo "${GH_REPO}" --workflow mercy-bot.yml --event workflow_dispatch --branch main --limit 20 --json status --jq 'any(.[]; (.status == "queued" or .status == "in_progress"))' | grep -qx true; then
              echo "::notice::Verified that GitHub created the successor workflow run."
              exit 0
            fi
            echo "Waiting for GitHub to publish the dispatched run (attempt ${attempt}/6)..."
            sleep 5
          done
          echo "::error::Dispatch was accepted but no successor run appeared in the Actions queue."
          exit 1

      - name: Continuation summary
        if: always()
        run: |
          {
            echo "### Mercy session continuation"
            echo ""
            echo "- Previous conclusion: ${{ needs.run-bot.result }}"
            echo "- Branch: main"
            echo "- Successor: dispatch requested"
          } >> "${GITHUB_STEP_SUMMARY}"
